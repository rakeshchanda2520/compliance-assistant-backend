  contact us: [business contact information, Data Protection Officer]
  when does this start: [come into force, commencement, publication]
  deadline: [come into force, commencement, time period]

# Intent hints — steer retrieval toward the chapter that governs the question.
intents:
  penalty_lookup:
    triggers: [fine, penalty, how much, punishment, liable, crore]
    boost_kinds: [Penalty, Schedule]
  rights_lookup:
    triggers: [my data, my rights, i want, can i ask, delete my, correct my]
    boost_chapter: ch-III
  obligation_lookup:
    triggers: [do we, do i have to, are we required, must we, our obligation]
    boost_chapter: ch-II
  definition_lookup:
    triggers: [what is, what does, who is, definition, meaning of, counts as]
    boost_kinds: [Definition]
  exemption_lookup:
    triggers: [exempt, does this apply, do the rules apply, out of scope]
    boost_chapter: ch-V
