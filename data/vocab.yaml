  # --- the Rules, 2025 ------------------------------------------------------
  # The Rules answer the "what exactly must we do" half of most questions, but
  # they say it in their own words. Without these bridges a question phrased
  # the way a user phrases it retrieves the Act's duty and misses the Rules'
  # specifics entirely — measured: "what must we tell a user when we notify
  # them of a breach" reached §8(6) but not rule 7, which is the provision
  # that actually lists what to tell them.
  notify: [intimation, intimate, personal data breach]
  notification: [intimation, intimate]
  tell them: [intimation, intimate]
  inform: [intimation, intimate]
  report a breach: [intimation, personal data breach, Board]
  how long: [time period, erase, retention, Third Schedule]
  how long can we keep: [time period, erase, retention, Third Schedule]
  retention: [time period, erase, retention, Third Schedule]
  retention period: [time period, erase, Third Schedule]
  delete after: [erase, time period]
  erase: [erase, time period]
  encryption: [encryption, security safeguards, obfuscation, masking]
  encrypt: [encryption, security safeguards]
  logs: [logs, monitoring, review, one year]
  audit log: [logs, monitoring, review]
  backup: [data-backups, continued processing]
  consent manager: [Consent Manager, First Schedule, registration]
  register as consent manager: [Consent Manager, First Schedule]
  net worth: [net worth, two crore rupees, First Schedule]
  parental consent: [verifiable consent, parent, child, guardian]
  verify age: [verifiable consent, adult, age, virtual token]
  age verification: [verifiable consent, adult, identity and age]
  children data: [child, verifiable consent, Fourth Schedule]
  school: [educational institution, Fourth Schedule, child]
  healthcare: [clinical establishment, healthcare professional, Fourth Schedule]
