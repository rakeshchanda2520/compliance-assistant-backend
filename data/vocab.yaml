# Vocabulary bridge: how ordinary people say it -> what the Act calls it.
#
# The users of this system are not lawyers. They ask "can I text my customers
# an offer?", not "is further processing for a distinct purpose lawful under
# section 6(1)?". Every phrase on the left is expanded into the statutory terms
# on the right before retrieval runs.
#
# Deterministic, auditable, and free — no model involved. This is the single
# highest value-per-line file in the project. Add to it whenever a real user
# question misses.

